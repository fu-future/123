name: ledger_app
description: "清新可爱的记账软件 - 记录日常收支、查看统计、管理分类"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理 + DI（Riverpod）
  flutter_riverpod: ^2.5.1

  # 本地数据库（离线优先）
  drift: ^2.20.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24

  # 路由
  go_router: ^14.2.0

  # 图表
  fl_chart: ^0.68.0

  # 网络（AI OpenAI 兼容接口）
  dio: ^5.5.0

  # 解析与序列化
  csv: ^6.0.0
  json_annotation: ^4.9.0

  # 工具
  shared_preferences: ^2.3.0
  uuid: ^4.4.0
  intl: ^0.20.3
  path_provider: ^2.1.3
  file_picker: ^8.0.6
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
